% ebook.cfg — tex4ht configuration for the EPUB trial build.
\Preamble{xhtml}

% Render generated images (math snippets and TikZ figures) as SVG.
% Paired with the dvisvgm_hashes make4ht extension, every formula/figure
% becomes a crisp, scalable vector image that Kindle's KFX engine renders well.
\Configure{Picture}{.svg}

% Note: the starter stylesheet (friends.css) is merged into the auto-generated
% friends-ebook.css by build.sh after conversion (tex4ebook has no add-CSS
% switch, and raw CSS can't go through \Css because of % and # characters).

\begin{document}
\EndPreamble
